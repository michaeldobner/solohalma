<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPRING ist umgezogen · SPRING has moved</title>
  <meta http-equiv="refresh" content="0; url=https://michaeldobner.github.io/mindpause/spring/">
  <link rel="canonical" href="https://michaeldobner.github.io/mindpause/spring/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ece8e1; color: #1a1d4e;
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #141519; color: #e9e7f2; } }
    a { color: inherit; }
  </style>
  <script>
    // Alten Offline-Speicher entfernen und weiterleiten. Spielstände bleiben erhalten,
    // weil die neue Adresse unter derselben Domain liegt.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
    }
    if (window.caches) caches.keys().then((keys) => keys.filter((k) => k.startsWith('solohalma') || k.startsWith('spring-v2.0')).forEach((k) => caches.delete(k))).catch(() => {});
    location.replace('https://michaeldobner.github.io/mindpause/spring/');
  </script>
</head>
<body>
  <p>SPRING ist umgezogen: <a href="https://michaeldobner.github.io/mindpause/spring/">michaeldobner.github.io/mindpause/spring</a><br>
     SPRING has moved: <a href="https://michaeldobner.github.io/mindpause/spring/">michaeldobner.github.io/mindpause/spring</a></p>
</body>
</html>
